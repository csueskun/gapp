name: gapp

networks:
  frontend_net:
  backend_net:
services:

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./services/php/app/:/var/www/html
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - frontend_net
  php:
    build: services/php
    depends_on:
      db:
        condition: service_healthy
      node:
        condition: service_started
      cups:
        condition: service_started
    volumes:
      - ./services/php/app/:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "composer config --no-plugins allow-plugins.kylekatarnls/update-helper true &&
             composer install --no-interaction &&
             chown -R www-data:www-data storage public public/js public/css bootstrap/cache resources/files &&
             php-fpm"
    env_file:
      - ./services/php/app/.env
    environment:
      - CUPS_SERVER=cups
      - DEBUG_HOST=${DEBUG_HOST}
      - OS=${OS}
    networks:
      - frontend_net
      - backend_net

  db:
    image: mysql:5.7
    ports: []
    environment:
      MYSQL_DATABASE: gapp
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./services/mysql:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net
    
  node:
    build: services/node
    networks:
      - frontend_net
      - backend_net

  cups:
    image: olbat/cupsd
    ports:
      - "631:631"
    volumes:
      - ./services/cups:/etc/cups
    networks:
      - backend_net

volumes:
  mysql_data:
