name: gapp
services:
  php:
    build: php
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../laravel/:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "composer config --no-plugins allow-plugins.kylekatarnls/update-helper true &&
             composer install --no-interaction &&
             chown -R www-data:www-data storage bootstrap/cache resources/files &&
             php artisan migrate &&
             php artisan serve --host=0.0.0.0 --port=9000"
    env_file:
      - ../laravel/.env
    ports:
      - "9000:9000"

  db:
    image: mysql:5.7
    ports: []
    environment:
      MYSQL_DATABASE: gapp
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      retries: 5
      start_period: 10s

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db

volumes:
  mysql_data:
